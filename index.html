<!DOCTYPE html>
<html lang="vi" x-data="ui()" x-init="boot()" :class="{ 'dark': state.dark }" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đồ Thờ Đại Lộc — Bảng điều khiển</title>
  <meta name="description" content="Bảng điều khiển bán hàng cho cửa hàng đồ thờ, tượng Phật" />

  <!-- Google Font: Be Vietnam Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons/css/flag-icons.min.css">

  <script>
    try {
      const darkOn = localStorage.getItem('themeDark') === '1'
        || (localStorage.getItem('themeDark') === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (darkOn) document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Be Vietnam Pro', 'system-ui', 'Segoe UI', 'Roboto', 'Arial', 'sans-serif'] },
          colors: {
            brand: { 50:'#fff9e6',100:'#fdecc3',200:'#fad98a',300:'#f0c254',400:'#d4a737',500:'#b48922',600:'#8b5e34',700:'#6a4729',800:'#4a3420',900:'#2e2216' }
          },
          boxShadow: {
            subtle: '0 10px 40px -10px rgba(0,0,0,.35)',
            innerglass: 'inset 0 1px 0 rgba(255,255,255,.08), inset 0 -1px 0 rgba(0,0,0,.25)'
          }
        }
      }
    }
  </script>

  <!-- Alpine / Lucide / Chart.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    html, body { font-family: 'Be Vietnam Pro', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }

    .glass { background: rgba(255,255,255,.06); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.12);box-shadow: 0 10px 40px -10px rgba(0,0,0,.35); }
    .glass-strong { background: linear-gradient(135deg, rgba(212,167,55,.18), rgba(136,98,45,.1)); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.14); }
    [x-cloak]{display:none!important;}
    .fi { border-radius: 3px; }
    /* ====== SIDEBAR (UNIFIED) ====== */

    /* Sidebar khống chế bề rộng & cho phép phần tử con lòi ra (toggle) */
    .sidebar{ position:relative; z-index:30; overflow:visible; width:240px; transition:width .22s ease; }
    .sidebar--collapsed{ width:72px; }

    /* Nút toggle nổi bám mép phải sidebar */
    .sidebar-toggle{
    position:absolute; top:16px; right:-14px;
    width:25px; height:25px; border-radius:12px;
    display:grid; place-items:center;
    box-shadow:0 8px 30px -12px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.12);
    z-index:50;
    }
    html:not(.dark) .sidebar-toggle{
    box-shadow:0 8px 30px -12px rgba(0,0,0,.25), inset 0 0 0 1px rgba(0,0,0,.08);
    }

    /* ===== Nav link – base */
    .sidebar .nav-link{
    display:flex; align-items:center; gap:.6rem;
    padding:.5rem .75rem; border-radius:14px;
    color:inherit; text-decoration:none;
    border:1px solid transparent;
    transition:background .15s ease, box-shadow .15s ease, border-color .15s ease, transform .15s ease;
    }
    .sidebar .nav-link i{ width:20px; height:20px; flex-shrink:0; }

    /* Hover chỉ áp dụng cho item KHÔNG active */
    .sidebar .nav-link:hover:not(.is-active){ background:rgba(255,255,255,.06); }
    html:not(.dark) .sidebar .nav-link:hover:not(.is-active){ background:rgba(0,0,0,.04); }

    /* Active “pill” đẹp */
    .sidebar .nav-link.is-active{
    background:linear-gradient(135deg, rgba(212,167,55,.18), rgba(136,98,45,.10));
    border-color:rgba(255,255,255,.14);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 10px 30px -15px rgba(0,0,0,.45);
    }

    /* Focus-visible để A11y tốt hơn */
    .sidebar .nav-link:focus-visible{ outline:2px solid rgba(59,130,246,.6); outline-offset:2px; }

    /* ===== Collapsed mode: chỉ icon, không “pill” dài */
    .sidebar--collapsed .nav-link{ justify-content:center; gap:0; padding:.5rem; }
    .sidebar--collapsed .nav-link span, .sidebar--collapsed .nav-link .label{ display:none; } /* ẩn label */

    .sidebar--collapsed .nav-link.is-active{ background:transparent; border-color:transparent; }
    .sidebar--collapsed .nav-link.is-active i{
    padding:6px; border-radius:10px;
    background:rgba(255,255,255,.10);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
    }
    .sidebar--collapsed .nav-link:hover i{
    background:rgba(255,255,255,.08); border-radius:10px; padding:6px;
    }
    html:not(.dark) .sidebar--collapsed .nav-link.is-active i,
    html:not(.dark) .sidebar--collapsed .nav-link:hover i{
    background:rgba(0,0,0,.06); box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
    }
   .dark .select-dark { color-scheme: dark; }

    /* Ẩn tên brand khi thu gọn */
    .sidebar--collapsed .brand-name{ display:none; }

    /* Đảm bảo cột nội dung luôn dưới sidebar */
    .main-shell{ position:relative; z-index:10; }



    /* ===== Mobile Dock (clean pill + FAB giữa) ===== */
    .dock-wrap{ position:fixed; left:0; right:0; bottom:0; z-index:50; pointer-events:none; }
    .dock{ pointer-events:auto; width:min(740px,94vw); margin:0 auto max(.9rem, env(safe-area-inset-bottom)); position:relative; border-radius:20px; padding:.65rem 1rem; backdrop-filter:blur(12px); background:rgba(16,16,20,.55); border:1px solid rgba(255,255,255,.10); box-shadow:0 18px 60px -24px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.08); }
    .dock-grid{ display:grid; grid-template-columns:1fr 1fr 72px 1fr 1fr; align-items:center; justify-items:center; gap:.25rem; min-height:56px; }
    .dock-item{ position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; font-size:.5rem; color:rgba(255,255,255,.74); padding:.25rem .35rem; }
    .dock-item i{ width:1.3rem; height:1.3rem }
    .dock-item.active{ color:#fff; transform: translateY(-1px); transition: transform .18s ease; }
    .indicator{ position:absolute; left:50%; transform:translateX(-50%); bottom:0px; width:43px; height:2px; border-radius:999px; background:#2b6cee; filter: blur(1px); }
    .fab{ position:absolute; left:50%; top:0; transform:translate(-50%,-35%); width:72px; height:72px; border-radius:9999px; display:grid; place-items:center; background:linear-gradient(135deg, #2563eb, #3b82f6); color:#fff; border:8px solid rgba(16,16,20,.55); box-shadow:0 20px 40px rgba(37,99,235,.55), inset 0 1px 0 rgba(255,255,255,.28); pointer-events:auto; }
    .fab i{ width:1.25rem; height:1.25rem }
    .has-dock{ padding-bottom:6.2rem; }
    html:not(.dark) .dock{ background:rgba(255,255,255,.75); border-color:rgba(0,0,0,.08); }
    html:not(.dark) .dock-item{ color:rgba(0,0,0,.70); }
    html:not(.dark) .dock-item.active{ color:#0f172a; }
    html:not(.dark) .fab{ border-color:rgba(25, 1, 1, 0.423); }
    /* ===== Tables -> Mobile cards ===== */ 
    .table-wrap{ border-radius:16px; overflow:hidden; } 
    table.responsive { width:100%; } /* Desktop keeps normal tables */ 
    @media (max-width: 640px){ .table-wrap { padding: .5rem; border-radius: 16px; } 
    table.responsive { display:block; border-collapse:separate; border-spacing:0 10px; } 
    table.responsive thead { display:none; } table.responsive tbody { display:block; } 
    table.responsive tr { display:block; background: rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.10); border-radius:16px; padding:10px 12px; margin:10px 0; } 
    html:not(.dark) table.responsive tr{ background: rgba(0,0,0,.03); border-color: rgba(0,0,0,.06); } 
    table.responsive td{ display:flex; align-items:center; justify-content:space-between; padding:8px 4px; border-bottom:1px dashed rgba(255,255,255,.08); font-size:.95rem; } 
    html:not(.dark) table.responsive td{ border-bottom-color: rgba(0,0,0,.06); } 
    table.responsive td:last-child{ border-bottom:0; padding-bottom:2px; } /* label bên trái mỗi ô */ 
    table.responsive td::before{ content: attr(data-label); font-weight:600; margin-right:10px; opacity:.8; } /* ô actions: các nút to hơn, căn phải */ 
    .mobile-actions{ display:flex; gap:.5rem; justify-content:flex-end; width:100%; } .mobile-actions > button{ padding:.5rem .6rem; border-radius:12px; } }
  </style>
</head>
<body class="min-h-screen text-slate-800 dark:text-slate-100">

  <!-- Wave Background -->
  <svg class="fixed inset-0 -z-10 w-full h-full" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#5ff1e5"/><stop offset="100%" stop-color="#1aa6b3"/></linearGradient>
      <linearGradient id="g2" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="#2cc5d3"/><stop offset="100%" stop-color="#2c67f2"/></linearGradient>
      <linearGradient id="gd1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#39e7db"/><stop offset="100%" stop-color="#0ea5b2"/></linearGradient>
      <linearGradient id="gd2" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="#1992b3"/><stop offset="100%" stop-color="#365df7"/></linearGradient>
    </defs>
    <g id="waves-dark"  class="fixed inset-0 pointer-events-none hidden dark:block" opacity="0.95">
      <rect width="100%" height="100%" fill="#05070d"/>
      <path d="M0,690 C220,600 420,740 640,660 C860,580 1000,650 1220,610 C1440,570 1600,620 1920,560 L1920,1080 L0,1080 Z" fill="url(#gd1)" opacity=".85"/>
      <path d="M0,760 C260,700 500,840 760,760 C1020,680 1180,760 1420,720 C1660,680 1770,740 1920,700 L1920,1080 L0,1080 Z" fill="url(#gd2)" opacity=".9"/>
    </g>
    <g id="waves-light" class="fixed inset-0 pointer-events-none block dark:hidden" opacity="0.9">
      <rect width="100%" height="100%" fill="#f8fafc"/>
      <path d="M0,690 C220,600 420,740 640,660 C860,580 1000,650 1220,610 C1440,570 1600,620 1920,560 L1920,1080 L0,1080 Z" fill="url(#g1)" opacity=".75"/>
      <path d="M0,760 C260,700 500,840 760,760 C1020,680 1180,760 1420,720 C1660,680 1770,740 1920,700 L1920,1080 L0,1080 Z" fill="url(#g2)" opacity=".8"/>
    </g>
  </svg>

  <!-- App layout -->
 <div class="min-h-screen flex flex-col lg:grid layout-grid"
     :style="state.sidebarCollapsed ? 'grid-template-columns:72px 1fr' : 'grid-template-columns:240px 1fr'">


    <!-- Sidebar desktop -->
    <aside :class="['hidden lg:block border-r border-white/10 bg-white/60 dark:bg-slate-900/40 backdrop-blur sidebar',
                state.sidebarCollapsed ? 'sidebar--collapsed' : '']">
    <!-- Header + toggle -->
    <div class="p-4 flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl grid place-items-center glass font-semibold shrink-0">Đ</div>
        <div class="font-semibold truncate" x-show="!state.sidebarCollapsed">Đồ Thờ Đại Lộc</div>

        <!-- Nút thu gọn/mở rộng -->
        <button
            class="sidebar-toggle glass"
            @click="state.sidebarCollapsed = !state.sidebarCollapsed; $nextTick(()=>{ if(window.lucide) lucide.createIcons(); })"
            :title="state.sidebarCollapsed ? (t?.('expand') ?? 'Mở rộng') : (t?.('collapse') ?? 'Thu gọn')">
            <i style="height:15px;" :data-lucide="state.sidebarCollapsed ? 'chevron-right' : 'chevron-left'"></i>
        </button>
    </div>

    <!-- Nav -->
    <nav class="px-2 space-y-1">
    <a @click.prevent="setTab('home')"      :class="navClass('home')"      class="nav-link" :title="t('nav.overview')">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i><span x-text="t('nav.overview')"></span>
    </a>
    <a @click.prevent="setTab('products')"  :class="navClass('products')"  class="nav-link" :title="t('nav.products')">
        <i data-lucide="package" class="w-5 h-5"></i><span x-text="t('nav.products')"></span>
    </a>
    <a @click.prevent="setTab('orders')"    :class="navClass('orders')"    class="nav-link" :title="t('nav.orders')">
        <i data-lucide="receipt-text" class="w-5 h-5"></i><span x-text="t('nav.orders')"></span>
    </a>
    <a @click.prevent="setTab('customers')" :class="navClass('customers')" class="nav-link" :title="t('nav.customers')">
        <i data-lucide="users" class="w-5 h-5"></i><span x-text="t('nav.customers')"></span>
    </a>
    <a @click.prevent="setTab('posts')"     :class="navClass('posts')"     class="nav-link" :title="t('nav.posts')">
        <i data-lucide="newspaper" class="w-5 h-5"></i><span x-text="t('nav.posts')"></span>
    </a>
    <a @click.prevent="setTab('banners')"   :class="navClass('banners')"   class="nav-link" :title="t('nav.banners')">
        <i data-lucide="images" class="w-5 h-5"></i><span x-text="t('nav.banners')"></span>
    </a>
    </nav>

    </aside>


    <!-- Content -->
    <div class="flex flex-col has-dock lg:pb-0 main-shell">
      <!-- Topbar -->
      <header class="sticky top-0 z-40 border-b border-white/10 bg-white/70 dark:bg-slate-900/40 backdrop-blur">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-3">
          <div class="relative flex-1 max-w-xl">
            <input type="text" :placeholder="t('search.placeholder', tabLabel(state.activeTab))" class="w-full pl-10 pr-3 py-2.5 rounded-xl glass focus:outline-none" x-model="state.search">
            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
          </div>
          <!-- Language dropdown -->
            <div x-data="{open:false}" class="relative">
                <button @click="open=!open"
                        @keydown.escape.window="open=false"
                        @click.outside="open=false"
                        class="px-2 py-3 rounded-xl glass text-sm flex items-center gap-2"
                        aria-haspopup="menu"
                        :aria-expanded="open">
                    <i data-lucide="globe" class="w-4 h-4"></i>
                    <span x-text="state.lang.toUpperCase()"></span>
                    <i data-lucide="chevron-down" class="w-4 h-4 opacity-70"></i>
                </button>

                <div x-show="open" x-transition.opacity.scale.origin.top.right
                    class="absolute right-0 mt-2 w-48 rounded-xl border border-white/10
                            bg-white/80 dark:bg-slate-900/80 backdrop-blur p-1 shadow-xl"
                    style="display:none" role="menu">
                    <!-- VI -->
                    <button type="button" role="menuitem"
                            @click="setLang('vi'); open=false"
                            class="w-full flex items-center justify-between px-3 py-2 rounded-lg
                                hover:bg-slate-100/70 dark:hover:bg-white/10">
                    <span class="flex items-center gap-2">
                        <span class="fi fi-vn" style="font-size:18px"></span>
                        <span x-text="t('vietnamese')"></span>
                    </span>
                    <i data-lucide="check" class="w-4 h-4" x-show="state.lang==='vi'"></i>
                    </button>

                    <!-- EN -->
                    <button type="button" role="menuitem"
                            @click="setLang('en'); open=false"
                            class="w-full flex items-center justify-between px-3 py-2 rounded-lg
                                hover:bg-slate-100/70 dark:hover:bg-white/10">
                    <span class="flex items-center gap-2">
                        <!-- Chọn cờ: GB (🇬🇧) hoặc US (🇺🇸) -->
                        <span class="fi fi-gb" style="font-size:18px"></span>
                        <span x-text="t('english')"></span>
                    </span>
                    <i data-lucide="check" class="w-4 h-4" x-show="state.lang==='en'"></i>
                    </button>

                </div>
            </div>

          <!-- Avatar dropdown (rút gọn) -->
          <div x-data="{open:false}" class="relative hidden md:block">
            <button @click="open=!open" @keydown.escape.window="open=false" @click.outside="open=false" class="flex items-center gap-2 rounded-xl glass px-2 py-1.5 focus:outline-none" aria-haspopup="menu" :aria-expanded="open">
              <span class="relative inline-block">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRaUqSojztqZnRXSFvvlm_sX78WOWk7w4ZNxQ&s" alt="Avatar" class="h-8 w-8 rounded-full object-cover ring-1 ring-black/5 dark:ring-white/10">
                <span class="absolute -right-0.5 -bottom-0.5 h-2.5 w-2.5 rounded-full bg-emerald-500 ring-2 ring-white dark:ring-slate-900"></span>
              </span>
              <span class="hidden sm:block text-sm font-medium">Tony</span>
              <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
            </button>
            <div x-show="open" x-transition.opacity.scale.origin.top.right class="absolute right-0 mt-2 w-64 rounded-2xl border border-white/10 bg-white/80 dark:bg-slate-900/70 backdrop-blur shadow-xl p-2" style="display:none" role="menu">
              <a href="/profile" class="flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-slate-100/70 dark:hover:bg-white/10"><i data-lucide="user" class="w-4 h-4"></i><span x-text="t('profile')"></span></a>
              <a href="/settings" class="flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-slate-100/70 dark:hover:bg-white/10"><i data-lucide="settings" class="w-4 h-4"></i><span x-text="t('settings')"></span></a>
              <button type="button" @click="toggleTheme(); open=false" class="w-full text-left flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-slate-100/70 dark:hover:bg-white/10"><i :data-lucide="state.dark ? 'sun' : 'moon'" class="w-4 h-4"></i><span x-text="t('switchTheme')"></span></button>
              <div class="my-2 h-px bg-slate-200/60 dark:bg-white/10"></div>
              <a href="/logout" class="flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-slate-100/70 dark:hover:bg-white/10 text-rose-600 dark:text-rose-400"><i data-lucide="log-out" class="w-4 h-4"></i><span x-text="t('logout')"></span></a>
            </div>
          </div>
        </div>
      </header>

      <!-- MAIN TABS -->
      <main class="max-w-7xl mx-auto px-4 py-6 w-full">
        <!-- HOME -->
        <section x-show="state.activeTab==='home'" x-cloak>
          <h1 class="text-2xl md:text-3xl font-bold" x-text="t('dashboard')"></h1>

          <!-- Banners showcase on Home -->
          <div class="mt-4 rounded-2xl glass overflow-hidden">
            <div class="flex items-center justify-between px-4 py-2">
              <div class="font-medium" x-text="t('banners.showcase')"></div>
              <a href="#" class="text-sm opacity-80" @click.prevent="setTab('banners')" x-text="t('manage')"></a>
            </div>
            <div class="relative">
              <!-- simple snap carousel using Alpine -->
              <div class="flex overflow-x-auto scroll-smooth snap-x snap-mandatory gap-3 p-3" x-ref="bannerStrip">
                <template x-for="b in activeBanners()" :key="b.id">
                  <div class="snap-center shrink-0 w-[320px] sm:w-[420px] h-40 rounded-xl overflow-hidden relative border border-white/10 bg-black/20">
                    <img :src="b.thumb" alt="banner" class="absolute inset-0 w-full h-full object-cover">
                    <div class="absolute inset-x-0 bottom-0 p-2 text-xs bg-gradient-to-t from-black/50 to-transparent">
                      <div class="font-medium" x-text="b.name"></div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>

          <!-- Quick actions -->
          <div class="mt-4 grid grid-cols-2 md:grid-cols-4 gap-3">
            <button class="rounded-2xl p-3 glass hover:bg-white/10 flex items-center gap-2" @click="openCreateOrder()"><i data-lucide="file-plus" class="w-4 h-4"></i><span x-text="t('actions.create')"></span></button>
            <button class="rounded-2xl p-3 glass flex items-center gap-2"><i data-lucide="truck" class="w-4 h-4"></i><span x-text="t('actions.inbound')"></span></button>
            <button class="rounded-2xl p-3 glass flex items-center gap-2" @click="setTab('orders')"><i data-lucide="bar-chart-3" class="w-4 h-4"></i><span x-text="t('actions.report')"></span></button>
            <button class="rounded-2xl p-3 glass flex items-center gap-2"><i data-lucide="credit-card" class="w-4 h-4"></i><span x-text="t('actions.reconcile')"></span></button>
          </div>

          <!-- KPIs -->
          <div class="mt-6 grid sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <div class="relative overflow-hidden rounded-2xl p-5 glass-strong">
              <i data-lucide="trending-up" class="absolute right-4 top-4 w-5 h-5 opacity-40"></i>
              <p class="text-sm opacity-80" x-text="t('kpi.todayRevenue')"></p>
              <div class="mt-2 text-3xl font-semibold" x-text="vnd(8650000)"></div>
              <p class="text-xs text-emerald-300 mt-1">↑ 8.2%</p>
            </div>
            <div class="relative overflow-hidden rounded-2xl p-5 glass">
              <i data-lucide="check-circle-2" class="absolute right-4 top-4 w-5 h-5 opacity-40"></i>
              <p class="text-sm opacity-80" x-text="t('kpi.completed')"></p>
              <div class="mt-2 text-3xl font-semibold">42</div>
              <p class="text-xs opacity-80">92%</p>
            </div>
            <div class="relative overflow-hidden rounded-2xl p-5 glass">
              <i data-lucide="user-plus" class="absolute right-4 top-4 w-5 h-5 opacity-40"></i>
              <p class="text-sm opacity-80" x-text="t('kpi.newCustomers')"></p>
              <div class="mt-2 text-3xl font-semibold">17</div>
              <p class="text-xs opacity-80" x-text="t('kpi.last24h')"></p>
            </div>

            { id:2, title:'Chọn tượng Phật hợp bàn thờ', cat:'Tư vấn', date:'2025-09-22', published:false, content:'...' },
          ],
          // banners demo
          banners:[
            { id:1, name:'Khuyến mãi Vu Lan', thumb:'https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=1200&auto=format&fit=crop', sort:1, active:true },

            'close':'Đóng','cancel':'Hủy','add':'Thêm','saveChanges':'Lưu thay đổi','publishNow':'Xuất bản ngay','vietnamese':'Tiếng Việt','english':'English',expand:'Mở rộng', collapse:'Thu gọn',
            nav:{ overview:'Tổng quan', products:'Sản phẩm', orders:'Đơn hàng', customers:'Khách hàng', posts:'Bài viết', banners:'Banner', more:'Thêm' },
            actions:{ title:'Thao tác', create:'Tạo đơn', inbound:'Nhập hàng', report:'Báo cáo', reconcile:'Đối soát', createOrder:'Tạo đơn hàng', addProduct:'Thêm sản phẩm', addCustomer:'Thêm khách hàng', addOrder:'Thêm đơn hàng', addPost:'Thêm bài viết', addBanner:'Thêm banner' },
            kpi:{ todayRevenue:'Doanh thu hôm nay', completed:'Đơn hoàn tất', newCustomers:'Khách mới', last24h:'Trong 24h qua', lowStock:'Tồn kho thấp', needRestock:'Cần nhập thêm' },
            chart:{ revenue30:'Doanh thu', split:'Cơ cấu doanh thu' },
            orders:{ recent:'Đơn hàng gần đây' },
            products:{ add:'Thêm sản phẩm mới', edit:'Chỉnh sửa sản phẩm', topSelling:'Top sản phẩm bán chạy' },
            customers:{ add:'Thêm khách hàng mới', edit:'Chỉnh sửa khách hàng' },
            posts:{ add:'Thêm bài viết', edit:'Chỉnh sửa bài viết' },
            banners:{ add:'Thêm banner', edit:'Chỉnh sửa banner', showcase:'Banner đang chạy' },
            search:{
              placeholder:(tab)=>`Tìm trong ${tab}...`,
              byName:'Tìm theo tên...',
              byOrder:'Tìm theo mã/khách...',
              byCustomer:'Tìm theo tên/SĐT...',
              byPost:'Tìm theo tiêu đề...',
              byBanner:'Tìm theo tên banner...'
            }
          },
          en:{

            'title':'Title','content':'Content','name':'Name','category':'Category','price':'Price','priceVND':'Price (VND)','stock':'Stock','phone':'Phone','address':'Address','code':'Code','customer':'Customer','date':'Date','status':'Status','total':'Total','product':'Product','sold':'Sold','revenue':'Revenue','thumb':'Image','sort':'Sort','thumbUrl':'Image URL',
            'close':'Close','cancel':'Cancel','add':'Add','saveChanges':'Save changes','publishNow':'Publish now','vietnamese':'Vietnamese','english':'English','expand':'Expand', 'collapse':'Collapse',
            nav:{ overview:'Overview', products:'Products', orders:'Orders', customers:'Customers', posts:'Posts', banners:'Banners', more:'More' },
            actions:{  title:'Actions', create:'Create order', inbound:'Inbound', report:'Reports', reconcile:'Reconcile', createOrder:'Create order', addProduct:'Add product', addCustomer:'Add customer', addOrder:'Add order', addPost:'Add post', addBanner:'Add banner' },
            kpi:{ todayRevenue:'Today revenue', completed:'Completed orders', newCustomers:'New customers', last24h:'Last 24h', lowStock:'Low stock', needRestock:'Need restock' },
            chart:{ revenue30:'Revenue', split:'Revenue split' },
            orders:{ recent:'Recent orders' },
            products:{ add:'Add new product', edit:'Edit product', topSelling:'Top selling products' },
            customers:{ add:'Add new customer', edit:'Edit customer' },
            posts:{ add:'Add post', edit:'Edit post' },
            banners:{ add:'Add banner', edit:'Edit banner', showcase:'Active banners' },
            search:{
              placeholder:(tab)=>`Search in ${tab}...`,
              byName:'Search by name...',
              byOrder:'Search by code/customer...',
              byCustomer:'Search by name/phone...',
              byPost:'Search by title...',
              byBanner:'Search banner name...'
            }
          }
        },

        t(key, arg=null){
          const lang=this.state.lang, d=this.dict[lang];
          // nested keys like 'nav.overview'
          const val=key.split('.').reduce((o,k)=>o?.[k], d);
          if(typeof val==='function') return val(arg);
          return val ?? key;
        },

        setLang(l){
          this.state.lang=l;
          localStorage.setItem('lang', l);
          this.$nextTick(()=>{ if (window.lucide) lucide.createIcons(); });
        },

        vnd(n){ return new Intl.NumberFormat(this.state.lang==='vi'?'vi-VN':'en-US',{style:'currency',currency:'VND'}).format(n); },
        tabLabel(t){ const map={home:this.t('nav.overview'),products:this.t('nav.products'),orders:this.t('nav.orders'),customers:this.t('nav.customers'),posts:this.t('nav.posts'),banners:this.t('nav.banners')}; return map[t]||this.t('nav.overview'); },
        navClass(t){
        return (this.state.activeTab===t ? 'is-active' : '');
        },

        setTab(t){
        this.state.activeTab = t;
        this.state.search = '';
        this.state.showMore = false; // đóng “More”
        this.$nextTick(()=>{ if(window.lucide) lucide.createIcons(); if(t==='home') this.renderCharts(); });
        },


        toggleTheme(){
          this.state.dark=!this.state.dark;
          localStorage.setItem('themeDark', this.state.dark?'1':'0');
          this.$nextTick(()=>{ if (window.lucide) lucide.createIcons(); });
        },
        openCreateOrder(){ this.state.showCreate=true; },

        // ===== PRODUCTS CRUD =====
        openProductModal(p=null){
          if(p){ this.state.editingProduct=true; this.formProduct={...p}; }
          else { this.state.editingProduct=false; this.formProduct={ id:null, name:'', cat:'', price:0, stock:0 }; }
          this.state.showProduct=true;
        },
        saveProduct(){
          if(this.state.editingProduct){
            const idx=this.state.products.findIndex(x=>x.id===this.formProduct.id);
            if(idx>-1) this.state.products[idx]={...this.formProduct};
          }else{
            const nid= (this.state.products.at(-1)?.id || 0) + 1;
            this.state.products.push({...this.formProduct, id:nid});
          }
          this.state.showProduct=false;
        },
        deleteProduct(id){
          if(confirm(this.state.lang==='vi'?'Xóa sản phẩm này?':'Delete this product?')){
            this.state.products = this.state.products.filter(p=>p.id!==id);
          }
        },

        // ===== CUSTOMERS CRUD =====
        openCustomerModal(c=null){
          if(c){ this.state.editingCustomer=true; this.formCustomer={...c}; }
          else { this.state.editingCustomer=false; this.formCustomer={ id:null, name:'', phone:'', addr:'' }; }
          this.state.showCustomer=true;
        },
        saveCustomer(){
          if(this.state.editingCustomer){
            const idx=this.state.customers.findIndex(x=>x.id===this.formCustomer.id);
            if(idx>-1) this.state.customers[idx]={...this.formCustomer};
          }else{
            const nid= (this.state.customers.at(-1)?.id || 0) + 1;
            this.state.customers.push({...this.formCustomer, id:nid});
          }
          this.state.showCustomer=false;
        },
        deleteCustomer(id){
          if(confirm(this.state.lang==='vi'?'Xóa khách hàng này?':'Delete this customer?')){
            this.state.customers = this.state.customers.filter(c=>c.id!==id);
          }
        },

        // ===== POSTS CRUD =====
        openPostModal(p=null){
          if(p){ this.state.editingPost=true; this.formPost={...p}; }
          else { this.state.editingPost=false; this.formPost={ id:null, title:'', cat:'', content:'', date:new Date().toISOString().slice(0,10), published:true }; }
          this.state.showPost=true;
        },
        savePost(){
          if(this.state.editingPost){
            const idx=this.state.posts.findIndex(x=>x.id===this.formPost.id);
            if(idx>-1) this.state.posts[idx]={...this.formPost};
          }else{
            const nid= (this.state.posts.at(-1)?.id || 0) + 1;
            this.state.posts.push({...this.formPost, id:nid});
          }
          this.state.showPost=false;
        },
        deletePost(id){
          if(confirm(this.state.lang==='vi'?'Xóa bài viết này?':'Delete this post?')){
            this.state.posts = this.state.posts.filter(p=>p.id!==id);
          }
        },

        // ===== BANNERS CRUD =====
        openBannerModal(b=null){
          if(b){ this.state.editingBanner=true; this.formBanner={...b}; }
          else { this.state.editingBanner=false; this.formBanner={ id:null, name:'', thumb:'', sort:(this.state.banners.at(-1)?.sort||0)+1, active:true }; }
          this.state.showBanner=true;
        },
        saveBanner(){
          if(this.state.editingBanner){
            const idx=this.state.banners.findIndex(x=>x.id===this.formBanner.id);
            if(idx>-1) this.state.banners[idx]={...this.formBanner};
          }else{
            const nid= (this.state.banners.at(-1)?.id || 0) + 1;
            this.state.banners.push({...this.formBanner, id:nid});
          }
          this.resortBanners();
          this.state.showBanner=false;
        },
        deleteBanner(id){
          if(confirm(this.state.lang==='vi'?'Xóa banner này?':'Delete this banner?')){
            this.state.banners = this.state.banners.filter(b=>b.id!==id);
          }
        },
        resortBanners(){
          this.state.banners.sort((a,b)=> (a.sort??0) - (b.sort??0));
        },
        activeBanners(){
          return this.state.banners.filter(b=>b.active).sort((a,b)=> (a.sort??0)-(b.sort??0));
        },

        // ===== Filters =====
        filteredProducts(){
          const q=this.state.search.toLowerCase().trim();
          return this.state.products.filter(p => !q || p.name.toLowerCase().includes(q) || p.cat.toLowerCase().includes(q));
        },
        filteredOrders(){
          const q=this.state.search.toLowerCase().trim();
          return this.state.orders.filter(o => !q || o.id.toLowerCase().includes(q) || o.cus.toLowerCase().includes(q));
        },
        filteredCustomers(){
          const q=this.state.search.toLowerCase().trim();
          return this.state.customers.filter(c => !q || c.name.toLowerCase().includes(q) || c.phone.replace(/\s/g,'').includes(q.replace(/\s/g,'')));
        },
        filteredPosts(){
          const q=this.state.search.toLowerCase().trim();
          return this.state.posts.filter(p => !q || p.title.toLowerCase().includes(q) || p.cat.toLowerCase().includes(q));
        },
        filteredBanners(){
          const q=this.state.search.toLowerCase().trim();
          return this.state.banners.filter(b => !q || b.name.toLowerCase().includes(q));
        },

        // ===== Boot & Charts =====
        boot(){
          // theme
          const saved = localStorage.getItem('themeDark');
          if (saved !== null) this.state.dark = (saved === '1');
          document.documentElement.classList.toggle('dark', this.state.dark);

          // lang
          const langSaved = localStorage.getItem('lang');
          if(langSaved) this.state.lang = langSaved;

          setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 0);
          this.renderCharts?.();

          this.$watch('state.dark', (val) => {
            document.documentElement.classList.toggle('dark', val);
            localStorage.setItem('themeDark', val ? '1' : '0');
          });
          this.$watch('state.lang', (val) => {
            localStorage.setItem('lang', val);
            this.$nextTick(()=>{ if (window.lucide) lucide.createIcons(); });
          });
          this.$watch('state.sidebarCollapsed', (v) => {
            localStorage.setItem('sidebarCollapsed', JSON.stringify(v));
            // cập nhật icon nếu cần
            if (window.lucide) setTimeout(()=>lucide.createIcons(),0);
            });

        },

        renderCharts(){
          this.$nextTick(()=>{
            const days=Number(this.state.range||30);
            const labels=Array.from({length:days},(_,i)=>i%2===0?`${i+1}`:'');
            const values=Array.from({length:days},()=>Math.round(5+Math.random()*10));
            const lc=document.getElementById('lineRevenue');
            if(lc){
              if(this.charts.line) this.charts.line.destroy();
              this.charts.line=new Chart(lc,{type:'line',data:{labels,
                datasets:[{data:values,fill:true,tension:.35,pointRadius:0,
                  backgroundColor:'rgba(212,167,55,.20)',borderColor:'rgba(212,167,55,.9)',borderWidth:2}]},
                options:{plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{grid:{color:'rgba(0,0,0,.08)'},
                  ticks:{callback:v=> (this.state.lang==='vi'?v+' tr':v+' M')}}}}});
            }
            const pc=document.getElementById('pieSplit');
            if(pc){
              if(this.charts.pie) this.charts.pie.destroy();
              const pieData={labels:[this.t('nav.products'), 'Nhang','Đèn dầu', 'Khác'],values:[40,25,20,15]};
              this.charts.pie=new Chart(pc,{type:'doughnut',data:{labels:pieData.labels,datasets:[{data:pieData.values,backgroundColor:['#fbbf24','#fb7185','#60a5fa','#a78bfa']}]},options:{cutout:'62%',plugins:{legend:{display:false}}}});
              const legend=document.getElementById('legendSplit');
              if(legend) legend.innerHTML=pieData.labels.map((l,i)=>`<li class='flex justify-between'><span>${l}</span><span class='font-medium'>${pieData.values[i]}%</span></li>`).join('');
            }
          });
        }
      }
    }
  </script>
</body>
</html>
